<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logic / Shapes — Performance Analysis · NeuroBloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page-wrap">

  <a class="back-link" href="index.html">‹ Back to Dashboard</a>

  <div class="page-title-row">
    <div class="g-icon logic">🔷</div>
    <div>
      <h1>Logic / Shapes</h1>
      <p>Problem-solving · yesterday</p>
    </div>
  </div>

  <div class="card analysis-panel standalone">
    <div class="analysis-head">
      <div>
        <h3>Performance Analysis</h3>
        <p>Last 7 sessions</p>
      </div>
    </div>
    <div class="stat-row">
      <div class="stat-box"><div class="num">78%</div><div class="lbl">Accuracy</div></div>
      <div class="stat-box"><div class="num">-4%</div><div class="lbl">vs last week</div></div>
      <div class="stat-box"><div class="num">8m 10s</div><div class="lbl">Avg. session</div></div>
    </div>
    <div class="bars">
      <div class="bar peak" style="height:85%"></div>
      <div class="bar" style="height:76%"></div>
      <div class="bar" style="height:70%"></div>
      <div class="bar" style="height:65%"></div>
      <div class="bar" style="height:72%"></div>
      <div class="bar" style="height:78%"></div>
      <div class="bar" style="height:78%"></div>
    </div>
    <div class="bar-labels"><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span><span>Mon</span><span>Tue</span></div>
    <div class="analysis-note"><b>Trend:</b> A slight dip mid-week lines up with a later bedtime on the sleep log — worth a gentle look.</div>
  </div>

</div>
</body>
</html>
