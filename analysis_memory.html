<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match — Performance Analysis · NeuroBloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page-wrap">

  <a class="back-link" href="index.html">‹ Back to Dashboard</a>

  <div class="page-title-row">
    <div class="g-icon memory">🧩</div>
    <div>
      <h1>Memory Match</h1>
      <p>Cognitive · played this morning</p>
    </div>
  </div>

  <div class="card analysis-panel standalone">
    <div class="analysis-head">
      <div>
        <h3>Performance Analysis</h3>
        <p>Last 7 sessions</p>
      </div>
    </div>
    <div class="stat-row">
      <div class="stat-box"><div class="num">92%</div><div class="lbl">Accuracy</div></div>
      <div class="stat-box"><div class="num">+15%</div><div class="lbl">vs last week</div></div>
      <div class="stat-box"><div class="num">6m 40s</div><div class="lbl">Avg. session</div></div>
    </div>
    <div class="bars">
      <div class="bar" style="height:40%"></div>
      <div class="bar" style="height:55%"></div>
      <div class="bar" style="height:50%"></div>
      <div class="bar" style="height:68%"></div>
      <div class="bar" style="height:74%"></div>
      <div class="bar" style="height:80%"></div>
      <div class="bar peak" style="height:92%"></div>
    </div>
    <div class="bar-labels"><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span><span>Mon</span><span>Tue</span></div>
    <div class="analysis-note"><b>Trend:</b> Accuracy has climbed steadily this week, with the strongest gains after switching to morning play sessions.</div>
  </div>

</div>
</body>
</html>
